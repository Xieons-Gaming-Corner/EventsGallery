name: Validate Filenames
permissions:
  contents: read

on: [push, pull_request]

jobs:
  check-invalid-filenames:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Windows-incompatible filenames
        run: |
          echo "🔍 Checking and fixing invalid filenames..."

          files=$(git ls-files)
          invalid_files=""

          for file in $files; do
            echo "Checking: $file"

            # If the filename contains Windows-invalid characters, build a safe new name
            if echo "$file" | grep -P '([<>:"\\|?*])' > /dev/null; then
              echo "❌ Invalid filename detected: $file"

              dir=$(dirname "$file")
              base=$(basename "$file")

              # Replace invalid characters with underscore
              safe_base=$(echo "$base" | sed 's/[<>:"\\|?*]/_/g')

              # Only attempt rename if the new name is different
              if [ "$base" != "$safe_base" ]; then
                new_path="$dir/$safe_base"
                echo "🔧 Renaming '$file' -> '$new_path'"
                git mv "$file" "$new_path"
                invalid_files+="$file -> $new_path"$'\n'
              fi
            fi
          done

          if [[ -z "$invalid_files" ]]; then
            echo "✅ No invalid filenames found!"
          else
            echo "ℹ️ Renamed files:"
            echo "$invalid_files"
            echo "✅ All invalid filenames were automatically fixed."
          fi
